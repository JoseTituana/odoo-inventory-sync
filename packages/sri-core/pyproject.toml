[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sri-core"
version = "0.1.0"
description = "Facturación electrónica del SRI de Ecuador: clave de acceso, XML, firma XAdES-BES, envío y RIDE. Sin dependencia de ningún framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["lxml>=4.9", "cryptography>=42", "requests>=2.28"]

[project.scripts]
sri-core = "sri_core.cli:main"

[project.optional-dependencies]
ride = ["reportlab>=4.0"]
dev = ["pytest>=8", "reportlab>=4.0", "pypdf>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
