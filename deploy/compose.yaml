# Odoo 19 Community (plus the Ecuadorian e-invoicing modules, see Dockerfile)
# + PostgreSQL 16, sized for a small shared server.
# Odoo listens on localhost only; a reverse proxy (Caddy) provides HTTPS.
services:
  db:
    image: postgres:16
    env_file: .env
    command: >
      postgres -c shared_buffers=64MB -c work_mem=4MB
      -c maintenance_work_mem=32MB -c effective_cache_size=256MB
      -c max_connections=30
    volumes:
      - db-data:/var/lib/postgresql/data
    # Production, staging and the point of sale share it; 256m ran at 84 %.
    mem_limit: 384m
    restart: unless-stopped

  odoo:
    build: .
    image: odoo-josheps:19
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    mem_limit: 900m
    restart: unless-stopped

  # Staging copy for training and tests. Not published by the reverse proxy:
  # reach it through an SSH tunnel (ssh -N -L 8070:127.0.0.1:8070 server).
  # Its database user can only connect to jats_staging.
  odoo-staging:
    build: .
    image: odoo-josheps:19
    depends_on:
      - db
    ports:
      - "127.0.0.1:8070:8069"
    volumes:
      - ./staging-data:/var/lib/odoo
      - ./config-staging:/etc/odoo
      - ./addons:/mnt/extra-addons
    mem_limit: 600m
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
