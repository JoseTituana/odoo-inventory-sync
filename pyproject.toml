[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-inventory-sync"
version = "0.1.0"
description = "Sync a product CSV with Odoo over XML-RPC, with dry-run and retries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openpyxl>=3.1", "reportlab>=4.0"]

[project.optional-dependencies]
# pymupdf, zxing-cpp and pillow: render labels and scan their barcodes back in tests.
# zxing-cpp ships no Python 3.10 wheel; on 3.10 the scan test skips itself.
dev = ["pytest>=8", "pymupdf", "zxing-cpp; python_version >= '3.11'", "pillow"]

[project.scripts]
odoo-sync = "odoo_inventory_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
